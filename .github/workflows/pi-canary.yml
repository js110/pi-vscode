# Canary: periodically verify pi-vscode against the LATEST Pi SDK release.
#
# The Pi SDK ships minor releases every 1-2 weeks. This workflow keeps the
# extension from silently breaking (or going stale):
#   - checks pass against @latest  ->  automatic upgrade PR
#   - checks fail against @latest  ->  automatic issue with a link to the run
#
# It can also be triggered manually from the Actions tab (workflow_dispatch).

name: Pi SDK Canary

on:
  schedule:
    - cron: "0 3 * * 1,4" # Mondays & Thursdays at 03:00 UTC
  workflow_dispatch:

permissions:
  contents: write
  issues: write
  pull-requests: write

jobs:
  canary:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies (with pinned SDK)
        run: npm ci

      - name: Upgrade to latest Pi SDK
        run: npm install @earendil-works/pi-coding-agent@latest

      - name: Audit SDK API surface
        run: node scripts/check-pi-api.mjs

      - name: Typecheck against latest SDK
        run: npm run typecheck

      - name: Build against latest SDK
        run: npm run compile

      # Best effort: some unit tests depend on local Pi auth (~/.pi/agent),
      # which a fresh CI runner does not have. The hard gates are the API
      # audit and the typecheck above; runtime regressions surface here or
      # in local integration tests.
      - name: Unit tests against latest SDK
        run: npm run test:unit
        continue-on-error: true

      - name: Report canary failure
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            const label = 'pi-sdk-canary';
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const { data: issues } = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              labels: label,
            });
            const body = `The scheduled canary run against \`@earendil-works/pi-coding-agent@latest\` failed.\n\nRun: ${runUrl}\n\nNext steps:\n1. \`npm install @earendil-works/pi-coding-agent@latest && npm run check\` locally\n2. Fix \`src/pi/\` (feature-detect or adapt) or pin the previous version\n3. See AGENTS.md -> "Pi SDK Upgrade Compatibility"`;
            if (issues.length > 0) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issues[0].number,
                body: `Canary failed again.\n\nRun: ${runUrl}`,
              });
            } else {
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title: `Pi SDK canary failed (${new Date().toISOString().slice(0, 10)})`,
                body,
                labels: [label],
              });
            }

      - name: Open upgrade PR when canary passes
        if: success()
        uses: peter-evans/create-pull-request@v7
        with:
          branch: deps/pi-sdk-canary-upgrade
          delete-branch: true
          title: 'chore(deps): upgrade pi-coding-agent to latest'
          body: |
            Automated canary upgrade: the extension builds, typechecks and passes
            the SDK API audit against the latest `@earendil-works/pi-coding-agent` release.

            - Review the [Pi changelog](https://www.npmjs.com/package/@earendil-works/pi-coding-agent)
            - Run `npm run check` plus a manual F5 smoke test before merging
          commit-message: 'chore(deps): upgrade @earendil-works/pi-coding-agent to latest'
          labels: |
            dependencies
            pi-sdk-upgrade
